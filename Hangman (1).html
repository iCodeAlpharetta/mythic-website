<style>
/* ---------- Theme colors ----------
   All colors are CSS variables so light/dark themes only need to redefine these.
   --bg: page background   --ink/--chalk: text and drawing color   --accent: focus ring & "Play again"
   --key/--keyhov: letter button normal/hover   --ok/--bad: correct/wrong guess colors
   The extra properties on :root keep content clear of phone notches and system bars. */
:root{--bg:#f1efe8;--ink:#1d3a36;--chalk:#1d3a36;--accent:#b4572a;--key:#e2dfd3;--keyhov:#d3cfbf;--ok:#2f7d55;--bad:#a63d3d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Dark theme when the OS prefers dark, unless the host forces light via data-theme="light" */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10302c;--ink:#eef2e6;--chalk:#eef2e6;--accent:#f0c94d;--key:#1c4540;--keyhov:#27564f;--ok:#7fd1a0;--bad:#f08a7e}}
/* Dark theme when the host forces it via data-theme="dark" */
:root[data-theme="dark"]{--bg:#10302c;--ink:#eef2e6;--chalk:#eef2e6;--accent:#f0c94d;--key:#1c4540;--keyhov:#27564f;--ok:#7fd1a0;--bad:#f08a7e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

/* ---------- Page layout ---------- */
/* Body centers the game column; font falls back through handwriting-style fonts */
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive,sans-serif;font-size:20px;display:flex;justify-content:center}
/* Narrow, centered column that works well on phones */
main{width:100%;max-width:520px;padding:20px 16px 32px;text-align:center}
h1{font-size:2.2rem;margin:0 0 4px;font-weight:400}
/* min-height reserves space so the layout doesn't jump when the message changes */
#status{min-height:1.6em;margin:4px 0 0}

/* ---------- Hangman drawing ---------- */
svg{width:200px;max-width:60%;height:auto;display:block;margin:8px auto}
/* Every shape is drawn as a chalk-style outline with no fill */
svg *{stroke:var(--chalk);stroke-width:4;stroke-linecap:round;fill:none}
/* Body parts are hidden until a wrong guess adds the "on" class */
.part{display:none}.part.on{display:inline}

/* ---------- Word display ---------- */
/* One underlined box per letter; wraps onto new lines for long words */
#word{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
#word span{width:1.4em;height:1.6em;border-bottom:3px solid var(--ink);font-size:1.7rem;line-height:1.6em}
/* Letters revealed after losing (never guessed) are shown in red */
#word span.miss{color:var(--bad)}

/* ---------- On-screen keyboard ---------- */
/* 7 columns x 4 rows fits the 26 letters */
#keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
#keys button{font:inherit;font-size:1.1rem;padding:8px 0;border:0;border-radius:6px;background:var(--key);color:var(--ink);cursor:pointer}
#keys button:hover:not(:disabled){background:var(--keyhov)}
/* Used keys are dimmed... */
#keys button:disabled{cursor:default;opacity:.45}
/* ...except hit/miss keys, which stay fully opaque and color-coded */
#keys button.hit{background:var(--ok);color:var(--bg);opacity:1}
#keys button.miss{background:var(--bad);color:var(--bg);opacity:1}
/* Visible keyboard focus ring for accessibility */
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#again{font:inherit;font-size:1.1rem;padding:8px 22px;border:2px solid var(--accent);border-radius:6px;background:transparent;color:var(--accent);cursor:pointer}
#hint{opacity:.75;margin:0}
/* Streak and high score line */
#score{margin:4px 0 0}
</style>

<body>
<main>
  <h1>Hangman</h1>
  <!-- Clue for the current word, filled in by start() -->
  <p id="hint"></p>
  <!-- Current win streak and saved high score, filled in by showScore() -->
  <p id="score"></p>
  <!-- Gallows + figure. The gallows is always visible; the six body parts appear one per wrong guess -->
  <svg viewBox="0 0 200 220" aria-label="Hangman drawing" role="img">
    <!-- Gallows: base, upright post, top beam, and the rope -->
    <path d="M20 210H110M50 210V20H140V45"/>
    <!-- Body parts, in the order they appear: head, torso, left arm, right arm, left leg, right leg -->
    <g id="parts">
      <circle class="part" cx="140" cy="65" r="20"/>
      <path class="part" d="M140 85V140"/>
      <path class="part" d="M140 100L115 125"/>
      <path class="part" d="M140 100L165 125"/>
      <path class="part" d="M140 140L118 175"/>
      <path class="part" d="M140 140L162 175"/>
    </g>
  </svg>
  <!-- Feedback messages; aria-live makes screen readers announce changes -->
  <p id="status" aria-live="polite"></p>
  <!-- Blanks / revealed letters of the secret word -->
  <div id="word" aria-label="Word to guess"></div>
  <!-- A-Z buttons are generated by the script below -->
  <div id="keys"></div>
  <!-- Shown only when a game ends -->
  <button id="again" hidden>Play again</button>
</main>
<script>
// Word bank: each entry is [WORD IN CAPS, hint shown to the player]
const WORDS=[
["INDUSTRIALIZATION","the process of changing from handmade goods to machine-made products"],
["FACTORY","a building where goods are manufactured using machines"],
["STEAM ENGINE","a machine that uses steam to produce mechanical power"],
["SPINNING JENNY","an invention that allowed workers to spin multiple threads at once"],
["POWER LOOM","a machine that automated the weaving of cloth"],
["COTTON GIN","a machine that separated cotton fibers from their seeds"],
["TELEGRAPH","a device that sent messages over long distances using electricity"],
["LOCOMOTIVE","a railway engine powered by steam"],
["RAILROAD","a track system used by trains to transport people and goods"],
["INVENTION","a new device or method created to solve a problem"],
["URBANIZATION","the growth of cities as people moved from rural areas"],
["MASSPRODUCTION","making large quantities of identical products"],
["CHILDLABOR","the employment of young children in factories and mines"],
["ASSEMBLYLINE","a production method where workers complete different steps"],
["COAL","a fossil fuel burned to produce heat and power"],
["IRONWORKS","a factory where iron was produced and shaped"],
["TEXTILE","a type of cloth made by weaving or knitting fibers"],
["ENTREPRENEUR","a person who starts and runs a business"],
["CAPITALISM","an economic system based on private ownership and profit"],
["WORKHOUSE","a place where poor people worked in exchange for food and shelter"],
["MIGRATION","the movement of people from one place to another"],
["MINING","the process of digging underground to extract valuable materials"],
["POLLUTION","harmful substances released into the air, water, or land"],
["LABOR UNION","an organization that protects workers' rights"],
["STRIKE","when workers stop working to demand better conditions"],
["WATTS","the surname of the inventor who improved the steam engine"],
["JAMESHARGREAVES","the inventor of the spinning jenny"],
["RICHARDARKWRIGHT","the inventor associated with the water frame"],
["EDMUNDCARTWRIGHT","the inventor of the power loom"],
["FACTORYSYSTEM","a method of manufacturing goods in centralized workplaces"]
];

// Number of wrong guesses allowed (matches the 6 body parts in the SVG)
const MAX=6;

// Game state:
//   word    - the secret word for this round
//   hint    - its clue
//   guessed - Set of letters tried so far (right or wrong)
//   wrong   - count of incorrect guesses
//   over    - true once the round has been won or lost
let word,hint,guessed,wrong,over;

// Shorthand for document.getElementById
const $=id=>document.getElementById(id);
const keys=$("keys");

// ---------- High score (stored in a cookie) ----------
// Read a cookie by name; returns null if it isn't set (or cookies are blocked)
function getCookie(name){
  const m=document.cookie.match(new RegExp("(?:^|; )"+name+"=([^;]*)"));
  return m?decodeURIComponent(m[1]):null;
}
// Write a cookie that lasts one year (31536000 seconds) and applies to the whole site
function setCookie(name,value){
  document.cookie=name+"="+encodeURIComponent(value)+"; max-age=31536000; path=/; SameSite=Lax";
}

// Score state:
//   streak - consecutive words guessed this session (a loss resets it to 0)
//   best   - the saved high score: your best streak ever, loaded from the cookie
let streak=0;
let best=parseInt(getCookie("hangmanHighScore"),10)||0;

// Update the score line on screen
function showScore(){
  $("score").textContent="Streak: "+streak+"  ·  High score: "+best;
}

// Build the on-screen keyboard: one button per letter, stored in data-k for lookup
for(const c of "ABCDEFGHIJKLMNOPQRSTUVWXYZ"){
  const b=document.createElement("button");
  b.textContent=c;b.dataset.k=c;b.onclick=()=>guess(c);keys.appendChild(b);
}

// Begin a new round: pick a random word and reset all state and UI
function start(){
  // Destructure the random [word, hint] pair into the two variables
  [word,hint]=WORDS[Math.floor(Math.random()*WORDS.length)];
  guessed=new Set();wrong=0;over=false;
  $("hint").textContent="Hint: "+hint;
  showScore();
  $("again").hidden=true;
  // Re-enable every key and clear its hit/miss styling
  keys.querySelectorAll("button").forEach(b=>{b.disabled=false;b.className=""});
  render();
  $("status").textContent="Pick a letter. You can miss "+MAX+" times.";
}

// Redraw the word blanks and the hangman figure.
// If reveal is true (player lost), unguessed letters are shown too, marked red via the "miss" class.
function render(reveal){
  $("word").innerHTML=[...word].map(c=>{
    // Show a letter if it was guessed, or if we're revealing the answer
    const show=guessed.has(c)||reveal;
    return `<span class="${show&&!guessed.has(c)?"miss":""}">${show?c:""}</span>`;
  }).join("");
  // Show the first `wrong` body parts, hide the rest
  document.querySelectorAll(".part").forEach((p,i)=>p.classList.toggle("on",i<wrong));
}

// Handle a guess of letter c (from a button click or the physical keyboard)
function guess(c){
  // Ignore input after the game ends or for letters already tried
  if(over||guessed.has(c))return;
  guessed.add(c);
  const hit=word.includes(c);
  if(!hit)wrong++;
  // Color the pressed key green/red and disable it
  const b=keys.querySelector(`[data-k="${c}"]`);
  b.disabled=true;b.classList.add(hit?"hit":"miss");
  // Win: every letter of the word has been guessed
  if([...word].every(l=>guessed.has(l))){end(true)}
  // Lose: out of allowed misses
  else if(wrong>=MAX){end(false)}
  // Otherwise: tell the player how it went and how many misses remain
  else{$("status").textContent=hit?"Yes, "+c+" is in the word.":(MAX-wrong)+" miss"+(MAX-wrong===1?"":"es")+" left."}
  // Update the display; reveal the full word only if the game was just lost
  render(over&&wrong>=MAX);
}

// Finish the round: update the score, show the result, lock the keyboard, offer a replay
function end(win){
  over=true;
  if(win){
    streak++;
    // New record: remember it and save it to the cookie
    if(streak>best){best=streak;setCookie("hangmanHighScore",best)}
  }else{
    // A loss ends the streak (the saved high score is kept)
    streak=0;
  }
  showScore();
  $("status").textContent=win?"You got it!":"Out of guesses. The word was "+word+".";
  keys.querySelectorAll("button").forEach(b=>b.disabled=true);
  // Show "Play again" and move focus to it so Enter/Space restarts quickly
  $("again").hidden=false;$("again").focus();
}

$("again").onclick=start;

// Physical keyboard support: any A-Z key makes a guess
document.addEventListener("keydown",e=>{
  // Don't hijack browser shortcuts like Ctrl+R or Cmd+C
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[a-z]$/i.test(e.key))guess(e.key.toUpperCase());
});

// Kick off the first round on page load
start();
</script>
